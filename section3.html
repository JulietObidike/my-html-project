<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Form Section</title>
  </head>
  <body>
    <section id="contact-form-section">
      <h2>Contact Form Section</h2>

      <form action="/submit-data" method="post">
        <div>
          <label for="name">Name:</label>
          <input type="text" id="name" name="user_name" required />
        </div>
        <div>
          <label for="email">Email:</label>
          <input type="email" id="email" name="user_email" required />
        </div>

        <div>
          <label for="phone">Phone Number:</label>
          <input type="tel" id="phone" name="user_phone" required />
        </div>

        <fieldset>
          <legend>Gender:</legend>
          <input
            type="radio"
            id="gender_female"
            name="user_gender"
            value="female"
            required
          />
          <label for="gender_female">Female</label>
          <input
            type="radio"
            id="gender_male"
            name="user_gender"
            value="male"
          />
          <label for="gender_male">Male</label>
        </fieldset>

        <div>
          <label for="country">Country:</label>
          <select id="country" name="user_country" required>
            <option value="" disabled selected>-- Select Country --</option>
            <option value="nigeria">Nigeria</option>
            <option value="ghana">Ghana</option>
            <option value="south_africa">South Africa</option>
            <option value="kenya">Kenya</option>
            <option value="egypt">Egypt</option>
          </select>
        </div>

        <div>
          <label for="note">Additional Details/Feedback:</label>
          <textarea
            id="note"
            name="user_note"
            rows="5"
            placeholder="Write any additional details or feedback here..."
          ></textarea>
        </div>

        <button type="submit">Send Inquiry</button>
      </form>
    </section>
  </body>
</html>
